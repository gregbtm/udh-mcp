name: Build and Push to GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: udh-mcp-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/udh-mcp

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: pip install --quiet -r requirements.lock.txt

      - name: Bytecode syntax check
        run: python -m compileall -q src

      - name: Run tool-registration and behavior tests
        working-directory: src
        run: python test_tool_registration.py

      - name: Dependency vulnerability audit (advisory)
        continue-on-error: true
        run: |
          pip install --quiet pip-audit
          pip-audit -r requirements.lock.txt --progress-spinner off

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: mode=max
          sbom: true

      - name: Trigger udh-mcp auto-redeploy
        if: github.event_name != 'pull_request'
        env:
          PORTAINER_WEBHOOK_UDH_MCP: ${{ secrets.PORTAINER_WEBHOOK_UDH_MCP }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_UDH_MCP" ]; then
            echo "::warning::PORTAINER_WEBHOOK_UDH_MCP not set -- skipping auto-redeploy trigger"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$PORTAINER_WEBHOOK_UDH_MCP")
          case "$code" in
            2*) echo "fired: udh-mcp (HTTP $code)" ;;
            *) echo "::error title=Redeploy failed::udh-mcp webhook returned HTTP $code"; exit 1 ;;
          esac

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "### UDH MCP CI/CD"
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image: \`${{ env.IMAGE }}:sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
