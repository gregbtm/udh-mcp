name: Build and Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/udh-mcp

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.lock.txt

      - name: Run tool-registration and behavior tests
        working-directory: src
        run: python test_tool_registration.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Same auto-redeploy pattern synology-proxy-mcp's docker-publish.yml
      # uses, and the same fix matrix-homelab's 4 image workflows just got
      # (2026-10-06): -f means a 404/5xx fails this step loudly rather than
      # a bare curl's silent success. PORTAINER_WEBHOOK_UDH_MCP won't exist
      # until the stack is created and gitops.py enable-webhook is run
      # against it -- continue-on-error so that's a visible no-op, not a
      # build failure, until then.
      - name: Trigger udh-mcp auto-redeploy
        continue-on-error: true
        env:
          PORTAINER_WEBHOOK_UDH_MCP: ${{ secrets.PORTAINER_WEBHOOK_UDH_MCP }}
        run: |
          if [ -n "$PORTAINER_WEBHOOK_UDH_MCP" ]; then
            curl -fsS -X POST "$PORTAINER_WEBHOOK_UDH_MCP"
          else
            echo "PORTAINER_WEBHOOK_UDH_MCP not set -- skipping auto-redeploy trigger"
          fi
